server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: document-ingestion-service
          uri: lb://document-ingestion-service
          predicates:
            - Path=/api/ingestion/**, /api/documents/**

        - id: rag-query-service
          uri: lb://rag-query-service
          predicates:
            - Path=/api/rag/**, /api/internal-qa/**, /api/chat/**

        - id: audit-analytics-service
          uri: lb://audit-analytics-service
          predicates:
            - Path=/api/audit/**, /api/gap-analysis/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
