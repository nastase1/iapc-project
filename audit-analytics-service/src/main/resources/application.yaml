# Microserviciul 3 (Membru 3): Agentic Gap Analysis, Audit Trail & Analytics
# Accesibil din exterior doar prin gateway-ingestion-service (http://localhost:8080/api/gap-analysis/**, /api/audit/**)
server:
  port: 8082

spring:
  application:
    name: audit-analytics-service
  datasource:
    url: jdbc:postgresql://localhost:5434/edupulse_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
  ai:
    model:
      embedding: none # agentul de gap analysis foloseste doar modelul de chat
    openai:
      api-key: ${OPENAI_API_KEY:demo-key}
      chat:
        options:
          model: gpt-4o

# Acelasi secret si issuer ca gateway-ul (JWT_SECRET trebuie identic in ambele servicii)
edupulse:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-dev-only-secret-at-least-32-bytes!!}
      issuer: ${JWT_ISSUER:edupulse-gateway}

audit:
  gap-analysis:
    chunk-size: ${GAP_CHUNK_SIZE:1500}        # caractere per bucata de reglementare
    max-chunks: ${GAP_MAX_CHUNKS:100}         # plafon de cost per rulare
    max-input-chars: ${GAP_MAX_INPUT_CHARS:500000}
    concurrency: ${GAP_CONCURRENCY:4}         # analize simultane
    queue-capacity: ${GAP_QUEUE_CAPACITY:20}  # in asteptare; peste limita => 429

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8080/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
