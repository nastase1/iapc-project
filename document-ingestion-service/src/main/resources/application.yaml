server:
  port: 8081

spring:
  application:
    name: document-ingestion-service
  datasource:
    url: jdbc:postgresql://localhost:5432/edupulse_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo-key}
      embedding:
        options:
          model: text-embedding-3-small

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
