server:
  port: 8082

spring:
  application:
    name: rag-query-service
  datasource:
    url: jdbc:postgresql://localhost:5432/edupulse_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo-key}
      chat:
        options:
          model: gpt-4o

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
