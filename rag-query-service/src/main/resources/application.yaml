# Microserviciul 2 (Membru 2): Core Advanced RAG & AI Orchestration
# Accesibil din exterior doar prin gateway-ingestion-service (http://localhost:8080/api/rag/**)
server:
  port: 8081

spring:
  application:
    name: rag-query-service
  datasource:
    url: jdbc:postgresql://localhost:5434/edupulse_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo-key}
      chat:
        options:
          model: gpt-4o
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        initialize-schema: false # schema este creata de gateway-ingestion-service
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8080/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
